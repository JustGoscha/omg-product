# Example kickoff for the neutral example product "Acme Field"
# (dispatchers plan jobs in a web app, technicians work them on phones).
# File: projects/recurring-jobs/sessions/kickoff.yaml
# Budget: 3 slides + 1 solution slide + 4 problem triages + 1 poll + 6 feature
# triages + 5 choices + wrapup ≈ 50 min, inside 60 with buffer.

id: kickoff
title: Recurring jobs — Kickoff
kind: kickoff
status: planned
date: 2026-10-21
duration: 60
goal: Decide what v1 of recurring jobs includes and how a series is stored.
participants:
  - { name: Marco, role: Dispatcher at Harbor Facility Services, kind: user }
  - { name: Priya, role: Head of Product, kind: decider }
  - { name: Jonas, role: Tech lead, kind: tech }
  - { name: Lea, role: Customer success, kind: expert }
  - { name: Dana, role: Product manager (facilitates), kind: decider }

sections:
  - id: why
    title: Why we're here
    phase: context
    steps:
      - id: s-why
        type: slide
        title: "Today: two questions"
        body: |
          1. Which problems do we have, and how bad are they?
          2. What do we build first to solve them?

          We stop at 11:00; whatever is open gets an owner.
        notes: Marco is a customer; thank him for the time. Keep it to one minute.

  - id: problem
    title: The problem
    phase: problem
    steps:
      - id: s-today
        type: slide
        title: '"Every quarter I lose two days copying jobs"'
        body: |
          Marco re-creates ~450 maintenance jobs per quarter by hand.
          Some get forgotten; the customer notices first.
        visual:
          type: flow
          direction: LR
          caption: How a repeat visit is planned today
          nodes:
            - { id: old, label: Last quarter's job, kind: store }
            - { id: disp, label: Dispatcher, kind: human, sub: "duplicate, change date, assign" }
            - { id: new, label: Next visit, kind: store }
            - { id: miss, label: Forgotten visit, kind: external, sub: customer calls }
          edges:
            - { from: old, to: disp }
            - { from: disp, to: new, label: "450× per quarter" }
            - { from: disp, to: miss, label: "~4 per month", dashed: true }
      - id: pr-time
        type: triage
        scale: severity
        title: Re-creating repeat jobs takes hours every quarter
        level: product
      - id: pr-forgotten
        type: triage
        scale: severity
        title: Visits get forgotten and customers notice first
        level: product
      - id: pr-overview
        type: triage
        scale: severity
        title: No overview of upcoming maintenance per customer
        level: product
      - id: pr-prices
        type: triage
        scale: severity
        title: Prices differ per maintenance contract
        body: Billing is out of scope for this project; check if the room agrees.
        level: business
      - id: p-forgotten
        type: poll
        title: How many visits were forgotten last quarter?
        answers: [none, 1–5, 6–20, more]
      - id: k-problems
        type: checkpoint
        title: Do we agree on the problems and how bad they are?
        body: If a problem is missing or ranked wrong, say it now. Everything after builds on this.

  - id: solution
    title: The idea
    phase: solution
    steps:
      - id: s-goal
        type: slide
        title: "Goal: from 90 to 15 minutes a week"
        body: |
          Set up a repeat once. The app creates the visits.
        visual:
          type: matrix
          columns: [Today, Goal]
          rows:
            - [Minutes per week re-creating jobs, "90", "15"]
            - [Forgotten visits per month, "~4", "0"]
      - id: s-picture
        type: slide
        title: The idea in one picture
        body: A job can repeat. The app creates the next visits ahead of time.
        visual: { type: prototype, src: prototypes/series.html#overview, height: 520 }
      - id: f-repeat
        type: triage
        title: Repeat a job every N weeks or months
        level: product
        visual: { type: prototype, src: prototypes/series.html#edit-series, focus: "[data-focus=repeat-picker]", height: 300 }
      - id: f-upcoming
        type: triage
        title: See all upcoming visits of a series
        level: product
        visual: { type: prototype, src: prototypes/series.html#overview, focus: "[data-focus=series-list]", height: 360 }
      - id: f-pause
        type: triage
        title: Pause a series, e.g. customer closed for renovation
        level: product
      - id: f-holidays
        type: triage
        title: Move visits that fall on public holidays
        level: product
      - id: f-reminder
        type: triage
        title: Remind the end customer one day before
        body: Needs SMS consent and costs per message.
        level: product
        timing: later
      - id: f-badge
        type: triage
        title: Mark visits that come from a series
        level: ux
        visual:
          type: html
          html: |
            <div style="font:15px system-ui;padding:16px">
              <b>Boiler service</b> · Harbor Bakery
              <span style="margin-left:8px;padding:2px 8px;border-radius:10px;background:#e8eefc;color:#2f5bd3;font-size:12px">↻ every 3 months</span>
            </div>

  - id: decide
    title: Decisions
    phase: decisions
    steps:
      # 1. Easy one first, to get the room moving.
      - id: d-horizon
        type: choice
        title: How far ahead does the app create visits?
        body: |
          Further ahead = visible earlier, but more visits change when a series changes.
        level: product
        decider: [decider, user]
        timing: now
        reversibility: two-way
        recommended: m3
        because: Technicians see their quarter, edits stay small.
        visual:
          type: matrix
          columns: ["1 month", "3 months", "12 months"]
          rows:
            - [Technicians see their next quarter, false, true, true]
            - [Visits in calendar per dispatcher, "~150", "~450", "~1,800"]
            - [A changed series touches, "~1 visit", "~3 visits", "~12 visits"]
        options:
          - { id: m1, label: 1 month, effort: xs }
          - { id: m3, label: 3 months, effort: xs }
          - { id: m12, label: 12 months, effort: xs, cons: [Calendar gets crowded] }

      # 2. One-way door, and the next decision depends on it.
      - id: d-series-change
        type: choice
        title: Can a dispatcher change a whole series later?
        body: One way to store a series. Hard to switch after launch.
        problem: |
          Today every visit is a single job. When a customer moves the quarterly
          boiler check from Mondays to Thursdays, Marco changes 4 jobs by hand,
          and the technicians' phones still show the old dates until he's done.
        why: |
          Whatever we store now decides whether "change all future visits" is one
          click or one click per visit. Switching later means migrating every
          series customers have already set up.
        facts:
          - 300–600 repeat jobs per mid-size customer per quarter
          - Technicians must see the next 3 months offline
          - Billing stays per visit (out of scope)
        level: tech
        decider: [decider, tech]
        timing: now
        reversibility: one-way
        recommended: rule
        because: Changing visits one by one is today's pain again.
        baseline: today
        notes: Jonas estimates copies at 3 days, rule at 8 days including the nightly job.
        options:
          - id: today
            label: Today
            baseline: true
            summary: Single jobs, copied by hand
            visual:
              type: tables
              tables:
                - name: jobs
                  columns:
                    - { name: id, type: uuid, pk: true }
                    - { name: customer_id, type: uuid, fk: customers.id }
                    - { name: scheduled_at, type: timestamp }
          - id: copies
            label: Create copies once
            summary: The app copies the job 12 months ahead, then forgets the series
            consequence: Changing a series later means editing every copied visit, as today.
            effort: s
            pros: [Ships a week earlier]
            cons: [Changing a series means editing every visit, No pause]
            forecloses: [Change all future visits at once, Pause a series]
            visual:
              type: tables
              tables:
                - name: jobs
                  columns:
                    - { name: id, type: uuid, pk: true }
                    - { name: customer_id, type: uuid, fk: customers.id }
                    - { name: scheduled_at, type: timestamp }
                    - { name: copied_from_id, type: uuid, fk: jobs.id, nullable: true }
          - id: rule
            label: Store the rule
            summary: A series keeps its rule; the app creates visits ahead of time
            consequence: Dispatchers change a series once; a nightly job keeps the next 3 months of visits up to date.
            effort: m
            pros: [Change all future visits at once, Pause and holidays possible later]
            cons: [Needs a nightly job that creates visits]
            enables: [Pause, holiday handling, series reports]
            visual:
              type: tables
              tables:
                - name: jobs
                  columns:
                    - { name: id, type: uuid, pk: true }
                    - { name: customer_id, type: uuid, fk: customers.id }
                    - { name: scheduled_at, type: timestamp }
                    - { name: series_id, type: uuid, fk: job_series.id, nullable: true }
                - name: job_series
                  note: one per repeating job
                  columns:
                    - { name: id, type: uuid, pk: true }
                    - { name: customer_id, type: uuid, fk: customers.id }
                    - { name: rule, type: text }
                    - { name: paused_until, type: date, nullable: true }

      - id: d-change-scope
        type: choice
        title: When a series changes, which visits change?
        body: |
          Example: Marco moves the boiler service from 09:00 to 08:00.
        level: ux
        decider: [decider, user]
        timing: now
        reversibility: two-way
        recommended: ask
        because: Works like every calendar app.
        notes: Only relevant if d-series-change = rule. Skip if the room chose copies.
        options:
          - id: ask
            label: Ask each time
            summary: Choose "only this visit" or "this and all future visits"
            pros: [No surprises]
            cons: [One more click]
            effort: s
            visual: { type: prototype, src: prototypes/series.html#scope-ask, focus: "[data-focus=scope-dialog]", height: 380 }
          - id: future
            label: Always all future
            summary: Single visits are changed from the visit itself
            pros: [Fastest for bulk changes]
            cons: [Easy to change 7 visits by accident]
            effort: xs
            visual: { type: prototype, src: prototypes/series.html#scope-future-only, focus: "[data-focus=scope-dialog]", height: 380 }

      - id: d-migration
        type: choice
        title: What happens to jobs dispatchers already copied?
        body: |
          ~380 likely series hide in two years of copied jobs per customer.
        level: product
        decider: [decider]
        timing: now
        reversibility: one-way
        recommended: suggest
        because: Setting up 380 by hand costs a full day.
        baseline: leave
        options:
          - id: leave
            label: Leave them
            summary: Old jobs stay; dispatchers set up each series by hand
            effort: xs
            cons: [A full day of setup per customer]
            visual:
              type: flow
              direction: LR
              nodes:
                - { id: old, label: Copied jobs, kind: store }
                - { id: disp, label: Dispatcher, kind: human }
                - { id: series, label: Series, kind: store }
              edges:
                - { from: disp, to: series, label: sets up each one by hand }
          - id: suggest
            label: Suggest series
            summary: The app finds repeats; the dispatcher confirms them in one list
            effort: m
            pros: [Minutes instead of a day, Dispatcher stays in control]
            cons: [+3 days of work]
            visual:
              type: flow
              direction: LR
              nodes:
                - { id: old, label: Copied jobs, kind: store }
                - { id: detect, label: Find repeats, kind: system, sub: "same title, regular gap" }
                - { id: disp, label: Dispatcher, kind: human }
                - { id: series, label: Series, kind: store }
              edges:
                - { from: old, to: detect }
                - { from: detect, to: disp, label: suggests }
                - { from: disp, to: series, label: confirms in one list }
              story:
                - { at: old, text: "Harbor has 2 years of copied jobs: 1,140 boiler checks, filter changes, elevator tests." }
                - { at: detect, text: "The app finds jobs with the same title at a regular gap: 380 likely series." }
                - { at: disp, text: "Marco sees one list: 'Boiler check, Hafenstr. 4, every 3 months' — confirm, adjust or skip." }
                - { at: series, text: "Confirmed series create the next 3 months of visits. Nothing changes without his click." }
          - id: auto
            label: Convert automatically
            summary: The app turns repeats into series without asking
            effort: m
            cons: [Wrong guesses create visits nobody planned]
            forecloses: [Clean undo]
            visual:
              type: flow
              direction: LR
              nodes:
                - { id: old, label: Copied jobs, kind: store }
                - { id: detect, label: Find repeats, kind: system, sub: "same title, regular gap" }
                - { id: series, label: Series, kind: store }
              edges:
                - { from: old, to: detect }
                - { from: detect, to: series, label: converts }

      - id: d-rights
        type: choice
        title: Who may create and change a series?
        body: |
        level: product
        decider: [decider]
        timing: now
        reversibility: two-way
        recommended: dispatch-only
        because: Team leads can still skip a single visit.
        options:
          - id: dispatch-only
            label: Dispatchers only
            effort: xs
            visual:
              type: matrix
              columns: [Create series, Change series, Skip one visit]
              rows:
                - [Dispatcher, true, true, true]
                - [Team lead, false, false, true]
                - [Technician, false, false, false]
          - id: leads-too
            label: Team leads too
            effort: xs
            visual:
              type: matrix
              columns: [Create series, Change series, Skip one visit]
              rows:
                - [Dispatcher, true, true, true]
                - [Team lead, true, true, true]
                - [Technician, false, false, false]

      - id: k-solution
        type: checkpoint
        title: Do we agree on v1 and what it leaves out?
        body: What's needed at launch, what comes after, and the decisions we made. Concerns go on record.

  - id: wrap
    title: Wrap-up
    phase: wrapup
    steps:
      - id: q-trust
        type: question
        title: What must be true before you trust visits the app created?
        placeholder: I can see them a week ahead, I get a summary, …
      - id: s-next
        type: slide
        title: Decided later, and next steps
        body: |
          - End-customer reminders — Priya, after 4 weeks of v1 use
          - Public holidays — Jonas, before rollout
          - Handoff spec by Friday; tech review on Tuesday
